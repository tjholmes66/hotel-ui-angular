<div class="container">
  <h1>Hotel UI</h1>

  @if (!authService.isLoggedIn()) {
    <p>Please sign in to continue.</p>
    <button class="primary" (click)="login()">Login</button>
  } @else {
    <p>Welcome, {{ authService.getUserName() }}.</p>
    <button class="secondary" (click)="logout()">Logout</button>
  }
</div>
